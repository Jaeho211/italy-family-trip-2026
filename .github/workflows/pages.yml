name: Deploy MkDocs site and editorial preview to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install legacy dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build existing site and authoritative trip data
        run: mkdocs build --strict
      - name: Set up Node for isolated editorial preview
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare photo assets locally from CC0 Wikimedia Commons
        run: python web/scripts/prepare_preview.py --photos
      - name: Install preview dependencies
        run: npm install --prefix web --no-audit --no-fund
      - name: Build React preview without replacing the main site
        run: npm --prefix web run build
      - name: Publish separate preview path
        run: mkdir -p site/preview && cp -a web/dist/. site/preview/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
