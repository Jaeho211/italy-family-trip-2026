name: Deploy React travel guide and archived MkDocs to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install legacy dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build existing site and authoritative trip data
        run: mkdocs build --strict
      - name: Set up Node for main React site
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare photo assets locally from freely licensed Wikimedia Commons files
        run: python web/scripts/prepare_preview.py --photos
      - name: Install React dependencies
        run: npm install --prefix web --no-audit --no-fund
      - name: Build main React site
        run: npm --prefix web run build
      - name: Promote React to project root and preserve legacy documents
        run: python web/scripts/publish_site.py
      - name: Verify public entry points
        run: |
          test -s site/index.html
          test -s site/legacy/index.html
          test -s site/legacy/reservations/index.html
          test -s site/legacy/assets/trip-data.json
          test -s site/assets/map/map.html
          test -s site/preview/index.html
          test -s site/sw.js
          test -s site/manifest.webmanifest
          test -s site/assets/journey/icon-192.png
          test -s site/assets/journey/icon-512.png
          ! grep -q '__VERSION__' site/sw.js
          ! grep -q '__PRECACHE__' site/sw.js
          python -c 'import json,pathlib; m=json.loads(pathlib.Path("site/manifest.webmanifest").read_text()); assert m["start_url"]==m["scope"]=="/italy-family-trip-2026/"; assert all(pathlib.Path("site",i["src"]).is_file() for i in m["icons"])'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
