<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>이탈리아 가족여행 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./map.css">
  <script defer src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script defer src="./map.js"></script>
</head>
<body>
  <main class="map-app">
    <section class="map-shell" aria-labelledby="region-title">
      <h1 id="region-title" class="region-title">관광지 지도</h1>
      <div id="map"></div>
      <p id="map-message" class="map-message" role="status" aria-live="polite">지도와 장소 정보를 불러오는 중입니다.</p>
    </section>

    <section class="place-panel" aria-labelledby="place-list-title">
      <h2 id="place-list-title">이 지역의 장소</h2>
      <p class="place-help">지도 사용이 어렵거나 로딩되지 않으면 아래 링크로 Google Maps를 열 수 있습니다.</p>
      <div id="place-list" class="place-list"></div>
    </section>
  </main>
</body>
</html>
